<!DOCTYPE html>
<html>
    <head>
        <title>My Superhero Card</title>
        <style>
            body{
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;

            }

            .heroname{
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }

            .tagline{
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }

            .label{
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;

            }

            .power{
                font-weight: bold;
                color: lightgreen;

            }

            .weakness{
                text-decoration-line: line-through;
                color: grey;
            }

            .badge{
                font-size: 28px;
                font-weight:bold;
                color: gold;
                transform: rotate(15deg); 
            }

            .madeby{
                color: coral;
                font-style: italic;
            }

        </style>
    </head>
    <body>
        <h1 class="heroname">Thunder Kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run fast than a cheetah</p>
        <p class="power">Can lift a school bus</p>

        <h2 class="label">weakness</h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness">Broccoli</p>

        <p class="badge">Top Hero</p>

        <p class="madeby">Created by Shivank</p>
    </body>
</html>
